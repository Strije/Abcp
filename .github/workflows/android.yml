name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # Секретов в APK нет: Laximo и админ ABCP — только на нашем сервере
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Постоянный debug-ключ (секрет DEBUG_KEYSTORE_B64 = base64 от debug.keystore).
      # Без него runner каждый раз создаёт новый ключ, и APK не ставится поверх прошлого.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 не задан — APK подписан случайным ключом"
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest --stacktrace 2>&1 | tee build.log

      # Ошибки компиляции — в аннотации, их видно без входа в GitHub
      - name: Report errors
        if: failure()
        run: |
          grep -E '^e: |What went wrong|^> |error:|Could not|FAILURE|FAILED|AssertionError' build.log | grep -v '^> Task' | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      # Отпечаток подписи APK — видно в аннотациях; у всех сборок он должен быть одинаковым
      - name: Signing fingerprint
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $AS verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i 'SHA-256' | while IFS= read -r l; do echo "::notice::$l"; done
          # Ожидаемый ключ (debug.keystore с 19.02.2026) — ffad7d27…
          $AS verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -qi 'ffad7d279f19c0ab' \
            || echo "::warning::APK подписан НЕ постоянным ключом — поверх прошлой версии не встанет"

      # Автообновление: сборку из main кладём на наш сервер, приложение само предложит её поставить.
      # Секрет APP_UPLOAD_TOKEN = APP_UPLOAD_TOKEN из /etc/avtodrug-api.env на сервере.
      - name: Publish update to app server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APP_UPLOAD_TOKEN: ${{ secrets.APP_UPLOAD_TOKEN }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$APP_UPLOAD_TOKEN" ]; then echo "::warning::APP_UPLOAD_TOKEN не задан — обновление не опубликовано"; exit 0; fi
          N=$GITHUB_RUN_NUMBER
          Q="versionName=$(jq -rn --arg v "1.0.$N" '$v|@uri')&notes=$(printf '%s' "$NOTES" | grep -v '^Co-Authored-By' | head -c 1500 | jq -sRr @uri)"
          curl -fsS --retry 3 -X PUT -H "X-Upload-Token: $APP_UPLOAD_TOKEN"             -H "Content-Type: application/vnd.android.package-archive"             --data-binary @app/build/outputs/apk/debug/app-debug.apk             "https://9077635-oy742028.twc1.net:8446/v1/app/apk/$N?$Q" > /dev/null
          echo "::notice::Обновление 1.0.$N опубликовано на сервере"

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
