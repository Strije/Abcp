name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Доступ к Laximo — из секретов репозитория (Settings → Secrets and variables → Actions)
      - name: Write local.properties
        env:
          LAXIMO_USER: ${{ secrets.LAXIMO_USER }}
          LAXIMO_PASS: ${{ secrets.LAXIMO_PASS }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "laximo.user=$LAXIMO_USER" >> local.properties
          echo "laximo.pass=$LAXIMO_PASS" >> local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
