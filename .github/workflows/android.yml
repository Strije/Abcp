name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # Доступ к Laximo — из секретов репозитория (Settings → Secrets and variables → Actions)
      - name: Write local.properties
        env:
          LAXIMO_USER: ${{ secrets.LAXIMO_USER }}
          LAXIMO_PASS: ${{ secrets.LAXIMO_PASS }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "LAXIMO_USER=$LAXIMO_USER" >> local.properties
          echo "LAXIMO_PASS=$LAXIMO_PASS" >> local.properties

      # Постоянный debug-ключ (секрет DEBUG_KEYSTORE_B64 = base64 от debug.keystore).
      # Без него runner каждый раз создаёт новый ключ, и APK не ставится поверх прошлого.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_B64 не задан — APK подписан случайным ключом"
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest --stacktrace 2>&1 | tee build.log

      # Ошибки компиляции — в аннотации, их видно без входа в GitHub
      - name: Report errors
        if: failure()
        run: |
          grep -E '^e: |What went wrong|^> |error:|Could not|FAILURE|FAILED|AssertionError' build.log | grep -v '^> Task' | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
