# nginx перед сервисом. setup.sh кладёт его в /etc/nginx/sites-available/avtodrug-api, подставив адрес,
# а HTTPS-часть (сертификат Let's Encrypt, 443, перенаправление с 80) дописывает certbot.
server {
    listen 80;
    listen [::]:80;
    # Второе имя — старый адрес: старые версии приложения приходят через прокси на старом сервере
    server_name __DOMAIN__ 9077635-oy742028.twc1.net;

    # APK версии direct загружает CI
    client_max_body_size 100m;
    # Журнал не ведём: в адресах запросов не должно оставаться лишнего
    access_log off;

    # Со старого сервера запросы идут через его nginx — настоящий IP клиента он передаёт в X-Real-IP
    set_real_ip_from 194.87.208.68;
    real_ip_header X-Real-IP;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
