<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разговоры робота — Автодруг92</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #677085; --line: #e3e6ec;
    --accent: #e8590c; --ok: #2b8a3e; --warn: #b26b00; --ask: #1c64c8; --bad: #c92a2a;
    --chip: #f0f2f5; --client: #fff1e8; --sel: #fff4ec;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --card: #1d2128; --text: #e6e9ef; --muted: #98a1b3; --line: #2e343e;
            --chip: #262b33; --client: #3a2a1f; --sel: #2a241f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { max-width: 1280px; margin: 0 auto; padding: 18px 16px 6px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  a { color: var(--ask); }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  button, select, input { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px;
                          background: var(--card); color: var(--text); }
  button { cursor: pointer; background: var(--chip); border-color: transparent; }
  button.on { background: var(--accent); color: #fff; }
  input[type=search] { flex: 1 1 220px; min-width: 0; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 8px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; flex: 1 1 110px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 12px; color: var(--muted); }
  main { max-width: 1280px; margin: 0 auto; padding: 0 16px 40px; display: grid; grid-template-columns: 380px 1fr; gap: 14px; }
  #list { display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 230px); overflow: auto; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer; }
  .item.sel { border-color: var(--accent); background: var(--sel); }
  .item .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
  .item .car { font-weight: 600; font-size: 14px; }
  .item .first { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--chip); margin: 3px 4px 0 0; }
  .chip.bad { background: rgba(201, 42, 42, .16); color: var(--bad); }
  .chip.good { background: rgba(43, 138, 62, .16); color: var(--ok); }
  .chip.warn { background: rgba(178, 107, 0, .16); color: var(--warn); }
  .chip.ask { background: rgba(28, 100, 200, .14); color: var(--ask); }
  #detail { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-height: 300px;
            max-height: calc(100vh - 230px); overflow: auto; }
  .msg { margin: 10px 0; display: flex; flex-direction: column; }
  .bubble { border-radius: 12px; padding: 9px 12px; white-space: pre-wrap; word-wrap: break-word; max-width: 92%; }
  .client { align-items: flex-end; }
  .client .bubble { background: var(--client); }
  .robot .bubble { background: var(--chip); }
  .meta { font-size: 12px; color: var(--muted); margin: 2px 4px; }
  .note { font-size: 13px; margin: 4px 4px 0; max-width: 92%; }
  .note.bad { color: var(--bad); } .note.good { color: var(--ok); } .note.warn { color: var(--warn); }
  .back { display: none; margin-bottom: 8px; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    #list, #detail { max-height: none; }
    main.open #list { display: none; }
    main:not(.open) #detail { display: none; }
    .back { display: inline-block; }
  }
</style>
</head>
<body>
<header>
  <h1>Разговоры с роботом</h1>
  <div class="muted">Что спрашивали клиенты и что ответил робот. Телефоны и почта скрыты. <a href="/podbor">Страница подбора</a></div>
  <div class="row" id="days"></div>
  <div class="row" id="filters"></div>
  <div class="row"><input type="search" id="q" placeholder="Поиск: слово клиента, ответ, машина, VIN"></div>
  <div class="stats" id="stats"></div>
</header>
<main id="main">
  <div id="list"></div>
  <div id="detail"><div class="empty">Выберите разговор слева</div></div>
</main>
<script>
const STATUS = {
  ok: ["подобрал", "good"], answer: ["ответил", "ask"], order: ["заказ", "good"], chat: ["разговор", ""],
  no_vin: ["нет VIN", "warn"], catalog_error: ["каталог не ответил", "bad"], vehicle_not_found: ["машина не найдена", "warn"],
  no_quick_groups: ["нет быстрого поиска", "warn"], choose_vehicle: ["выбор машины", "ask"], car_mismatch: ["марка не совпала", "warn"],
};
const FILTERS = [
  ["all", "Все", () => true],
  ["bad", "С минусом", d => d.bad > 0],
  ["suspect", "Судья сомневается", d => d.suspect > 0],
  ["empty", "Пустые ответы", d => d.empty > 0],
  ["novin", "Без машины", d => d.turns.some(t => ["no_vin", "vehicle_not_found", "catalog_error"].includes(t.status))],
  ["order", "Дошли до заказа", d => d.turns.some(t => t.status === "order")],
];
const state = { days: 7, filter: "all", q: "", data: [], sel: null };
const $ = id => document.getElementById(id);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function when(t) { return t ? t.slice(8, 10) + "." + t.slice(5, 7) + " " + t.slice(11, 16) : ""; }
function chip(text, cls) { return el("span", "chip " + (cls || ""), text); }

function buttons(box, items, current, onPick) {
  box.replaceChildren(...items.map(([key, label]) => {
    const b = el("button", key === current ? "on" : "", label);
    b.onclick = () => onPick(key);
    return b;
  }));
}

async function load() {
  $("list").replaceChildren(el("div", "empty", "Загружаю…"));
  try {
    const r = await fetch("/v1/podbor/journal?days=" + state.days, { credentials: "same-origin" });
    if (!r.ok) throw new Error("сервер ответил " + r.status);
    state.data = (await r.json()).dialogs || [];
  } catch (e) {
    $("list").replaceChildren(el("div", "empty", "Не удалось загрузить: " + e.message));
    return;
  }
  render();
}

function visible() {
  const f = FILTERS.find(x => x[0] === state.filter)[2];
  const q = state.q.trim().toLowerCase();
  return state.data.filter(d => f(d) && (!q || (d.car + " " + d.turns.map(t => t.text + " " + t.answer).join(" "))
    .toLowerCase().includes(q)));
}

function render() {
  buttons($("days"), [[1, "Сегодня"], [3, "3 дня"], [7, "Неделя"], [30, "Месяц"], [90, "3 месяца"]], state.days,
          k => { state.days = k; load(); });
  buttons($("filters"), FILTERS.map(x => [x[0], x[1] + " · " + state.data.filter(x[2]).length]), state.filter,
          k => { state.filter = k; render(); });
  const all = state.data, turns = all.flatMap(d => d.turns);
  const secs = turns.map(t => t.seconds || 0).sort((a, b) => a - b);
  const sum = (k) => all.reduce((s, d) => s + d[k], 0);
  const st = [
    [all.length, "разговоров"], [turns.length, "реплик клиентов"],
    [turns.filter(t => t.status === "ok").length, "подобрал детали"],
    [all.filter(d => d.turns.some(t => t.status === "order")).length, "дошли до заказа"],
    [sum("good") + " / " + sum("bad"), "оценки плюс / минус"],
    [sum("suspect"), "сомнения судьи"], [sum("empty"), "пустых ответов"],
    [secs.length ? secs[Math.floor(secs.length / 2)].toFixed(0) + " с" : "—", "обычное время ответа"],
  ];
  $("stats").replaceChildren(...st.map(([v, l]) => { const s = el("div", "stat"); s.append(el("b", "", v), el("span", "", l)); return s; }));

  const list = visible();
  if (!list.length) {
    $("list").replaceChildren(el("div", "empty", "Таких разговоров нет"));
  } else {
    $("list").replaceChildren(...list.map(d => {
      const it = el("div", "item" + (d.dialog === state.sel ? " sel" : ""));
      const top = el("div", "top");
      top.append(el("span", "", when(d.start)), el("span", "", d.turns.length + " репл."));
      it.append(top, el("div", "car", d.car || "машина не определена"), el("div", "first", d.turns[0].text));
      const chips = el("div");
      const last = STATUS[d.turns[d.turns.length - 1].status] || [d.turns[d.turns.length - 1].status, ""];
      chips.append(chip(last[0], last[1]));
      if (d.bad) chips.append(chip("минус " + d.bad, "bad"));
      if (d.good) chips.append(chip("плюс " + d.good, "good"));
      if (d.suspect) chips.append(chip("судья: " + d.suspect, "warn"));
      if (d.empty) chips.append(chip("пустой ответ", "bad"));
      if (d.used) chips.append(chip("менеджер взял ответ", "ask"));
      it.append(chips);
      it.onclick = () => { state.sel = d.dialog; render(); $("main").classList.add("open"); $("detail").scrollTop = 0; };
      return it;
    }));
  }
  show(all.find(d => d.dialog === state.sel));
}

function show(d) {
  const box = $("detail");
  if (!d) { box.replaceChildren(el("div", "empty", "Выберите разговор слева")); return; }
  const back = el("button", "back", "← К списку");
  back.onclick = () => $("main").classList.remove("open");
  const head = el("div");
  head.append(el("div", "car", d.car || "машина не определена"),
              el("div", "muted", when(d.start) + " — " + when(d.end) + " · разговор " + d.dialog));
  const out = [back, head];
  for (const t of d.turns) {
    const c = el("div", "msg client");
    c.append(el("div", "meta", "Клиент · " + when(t.t)), el("div", "bubble", t.text));
    const r = el("div", "msg robot");
    const s = STATUS[t.status] || [t.status, ""];
    const meta = el("div", "meta");
    meta.append(chip(s[0], s[1]), document.createTextNode(" " + (t.seconds ?? "?") + " с" + (t.llm ? " · с моделью" : "")));
    r.append(meta, el("div", "bubble", t.answer || "— робот ничего не ответил —"));
    if (!t.answer) r.lastChild.classList.add("note", "bad");
    if (t.handoff && t.handoff.length) r.append(el("div", "note warn", "Менеджеру: " + t.handoff.join("; ")));
    if (t.judge && t.judge.verdict === "suspect") {
      for (const p of t.judge.problems.length ? t.judge.problems : [{ what: "без пояснения" }])
        r.append(el("div", "note warn", "Судья: " + p.what));
    }
    for (const f of t.feedback)
      r.append(el("div", "note " + (f.good ? "good" : f.good === false ? "bad" : ""),
                  (f.good ? "Оценка: помог" : f.good === false ? "Оценка: не помог" : "Оценка") + (f.comment ? " — " + f.comment : "")));
    if (t.used) r.append(el("div", "note good", t.used === "insert" ? "Менеджер вставил ответ в чат" : "Менеджер скопировал ответ"));
    out.push(c, r);
  }
  box.replaceChildren(...out);
}

$("q").oninput = e => { state.q = e.target.value; render(); };
load();
</script>
</body>
</html>
